server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Keep these current. YouTube regularly breaks older youtube-source builds,
    # and an outdated plugin shows up as /play failing to resolve anything.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: ${LAVALINK_PASSWORD:changeme}
    sources:
      # The built-in YouTube source is deprecated; the plugin above replaces it.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    # Client order matters. MUSIC and WEB_EMBEDDED handle age/region gating that
    # the plain WEB client refuses, and ANDROID_VR is the most reliable for
    # straight playback, so it leads.
    clients:
      - ANDROID_VR
      - MUSIC
      - WEB_EMBEDDED
      - WEB
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 1000
      albumLoadLimit: 1000
    ratelimit:
      ipBlocks: []
      excludedIps: []
      retryLimit: -1

logging:
  level:
    root: INFO
