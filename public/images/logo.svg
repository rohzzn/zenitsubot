<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="#5865F2"/>
  
  <!-- Lightning Bolt -->
  <path d="M140 40 L100 128 L130 128 L90 216 L150 115 L120 115 L140 40 Z" 
        fill="#FEE75C" 
        stroke="#F0B232" 
        stroke-width="4" 
        stroke-linejoin="round"/>
  
  <!-- Inner glow effect -->
  <circle cx="128" cy="128" r="120" fill="url(#gradient)" opacity="0.3"/>
  
  <defs>
    <radialGradient id="gradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#5865F2;stop-opacity:0" />
    </radialGradient>
  </defs>
</svg>

