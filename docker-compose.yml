services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      # Wait for Lavalink to actually accept connections, not just for its
      # container to start. The JVM takes several seconds to come up, and
      # starting the bot early makes its first websocket attempt race the
      # server; Shoukaku then sits idle instead of retrying.
      lavalink:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./prisma:/app/prisma
      - ./public:/app/public
    ports:
      - "80:3000"
    networks:
      - zenitsu-network
    # No `command:` override here on purpose — it would bypass the image
    # entrypoint, which is what applies pending Prisma migrations.

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    environment:
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-changeme}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    expose:
      - "2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    restart: unless-stopped
    healthcheck:
      # Every route needs auth, so this deliberately omits -f: any HTTP
      # response (including 401) proves Lavalink is up and serving, which is
      # all the gate needs, and it keeps the password out of the healthcheck.
      test: ['CMD', 'curl', '-sS', '-o', '/dev/null', 'http://localhost:2333/version']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - zenitsu-network

  # Self-hosted metasearch. Public SearXNG instances rate-limit hard or disable
  # the JSON format outright, and DuckDuckGo serves a captcha to servers, so
  # running our own is the only reliable keyless search. Never published on a
  # host port: only the bot reaches it, over the internal network.
  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=4
    expose:
      - "8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - zenitsu-network


networks:
  zenitsu-network:
    driver: bridge

volumes:
  db:


